ShortDescription: The VSS (Very Simple Syntax) Programming Language Compiler and Runtime
Description: |-
  VSS is a beginner-friendly, dynamically typed scripting language with a clean,
  English-like syntax. Version 2.1 ships a complete standard library (math, string,
  file, json, http, time, random, system, database, crypto, network), a native
  bytecode VM, colored error diagnostics, and the grab module system.
